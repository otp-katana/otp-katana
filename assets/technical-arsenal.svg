      .name{font:11px monospace;fill:#E8D5EF}
      .num{font:10px monospace;fill:#BEAED5}
      .rule{stroke:#AAA5B9;stroke-opacity:.3}
      .chip{fill:#121020;stroke:#AAA5B9;stroke-opacity:.3}
    </style>
  </defs>

  <rect width="820" height="430" rx="8" fill="url(#bg)"/>
