        <path d="M3 11H31M9 8H9.1M13 8H13.1M17 8H17.1M8 17L13 21L8 25M17 25H25" fill="none" stroke="#E8D5EF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <text x="17" y="51" text-anchor="middle" class="name">Web UI</text>
    </g>
    <text x="40" y="440" class="sub">INTERFACES / 3D / DATA VIZ</text>
