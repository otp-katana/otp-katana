  <!-- Card 04: Tools & Environment -->
  <g>
    <rect x="462" y="280" width="414" height="178" rx="5" class="panel"/>
    <path d="M462 317H876" class="rule"/>
    <rect x="462" y="280" width="414" height="37" rx="5" fill="url(#header)"/>
    <text x="478" y="303" class="index">04</text>
    <text x="506" y="303" class="heading">TOOLS &amp; ENVIRONMENT</text>

    <g transform="translate(482 337)">
      <image href="https://cdn.simpleicons.org/git/F05032" width="30" height="30"/>
      <text x="15" y="51" text-anchor="middle" class="name">Git</text>
    </g>
    <g transform="translate(558 337)">
      <image href="https://cdn.simpleicons.org/github/FFFFFF" width="30" height="30"/>
      <text x="15" y="51" text-anchor="middle" class="name">GitHub</text>
    </g>
    <g transform="translate(634 337)">
      <image href="https://cdn.simpleicons.org/visualstudiocode/007ACC" width="30" height="30"/>
      <text x="15" y="51" text-anchor="middle" class="name">VS Code</text>
    </g>
    <g transform="translate(710 337)">
      <image href="https://cdn.simpleicons.org/linux/FCC624" width="30" height="30"/>
