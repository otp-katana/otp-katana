    <g id="github">
      <path d="M17 3C9 3 3 9 3 17C3 23 7 28 13 30V25C10 26 8 24 7 22C6 20 5 19 4 19C7 18 8 21 9 22C10 23 11 23 13 22V19C8 18 6 15 6 11L10 7L14 9C16 8 19 8 21 9L25 7L28 11C28 15 26 18 21 19V30C27 28 31 23 31 17C31 9 25 3 17 3Z" fill="#FFFFFF"/>
    </g>

    <!-- VS Code-inspired ribbon -->
    <g id="vscode">
      <path d="M24 3L31 6V28L24 31L10 20L4 25L1 22L8 17L1 12L4 9L10 14Z" fill="#007ACC"/>
      <path d="M24 3L10 14V20L24 31Z" fill="#0098FF"/>
      <path d="M10 14L24 3V31L10 20L4 17Z" fill="#007ACC"/>
    </g>

    <!-- Linux-inspired penguin -->
    <g id="linux">
      <ellipse cx="17" cy="19" rx="11" ry="12" fill="#202027"/>
      <ellipse cx="17" cy="20" rx="7" ry="9" fill="#FFFFFF"/>
      <ellipse cx="13" cy="11" rx="3" ry="4" fill="#FFFFFF"/>
      <ellipse cx="21" cy="11" rx="3" ry="4" fill="#FFFFFF"/>
      <circle cx="14" cy="11" r="1.2" fill="#202027"/>
      <circle cx="20" cy="11" r="1.2" fill="#202027"/>
      <path d="M13 15L21 15L17 19Z" fill="#FCC624"/>
      <path d="M9 27L5 30M25 27L29 30" stroke="#FCC624" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Docker-inspired whale -->
    <g id="docker">
      <g fill="#2496ED">
        <rect x="5" y="12" width="5" height="5"/>
        <rect x="11" y="12" width="5" height="5"/>
        <rect x="17" y="12" width="5" height="5"/>
        <rect x="11" y="6" width="5" height="5"/>
        <rect x="17" y="6" width="5" height="5"/>
        <rect x="23" y="12" width="5" height="5"/>
        <path d="M2 19H30C29 27 23 30 15 29C8 28 4 25 2 19Z"/>
      </g>
      <path d="M27 14C31 12 32 15 31 17L28 18" fill="none" stroke="#2496ED" stroke-width="2"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="900" height="510" rx="8" fill="url(#bg)"/>
  <rect width="900" height="510" rx="8" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="899" height="509" rx="8" fill="none" stroke="#AAA5B9" stroke-opacity=".6"/>

  <!-- Header -->
  <rect x="1" y="1" width="898" height="62" rx="7" fill="url(#head)"/>
  <path d="M24 63H876" class="rule"/>
  <rect x="24" y="20" width="3" height="25" fill="#BEAED5"/>
  <text x="38" y="30" class="heading" font-size="15">TECHNICAL ARSENAL</text>
  <text x="38" y="47" class="sub">SYSTEM CAPABILITIES / ACTIVE STACK</text>
  <text x="875" y="28" text-anchor="end" class="idx">ACE // 02</text>
  <text x="875" y="45" text-anchor="end" class="sub">17 TECHNOLOGIES</text>

  <!-- 01 Programming Languages -->
  <g>
    <rect x="24" y="82" width="414" height="178" rx="5" class="panel"/>
    <rect x="24" y="82" width="414" height="37" rx="5" fill="url(#head)"/>
    <path d="M24 119H438" class="rule"/>
    <text x="40" y="105" class="idx">01</text>
    <text x="68" y="105" class="heading">PROGRAMMING LANGUAGES</text>

    <use href="#python" x="51" y="137" width="34" height="34"/>
    <text x="68" y="192" text-anchor="middle" class="name">Python</text>

    <use href="#cpp" x="144" y="137" width="34" height="34"/>
    <text x="161" y="192" text-anchor="middle" class="name">C++</text>

    <use href="#javascript" x="237" y="137" width="34" height="34"/>
    <text x="254" y="192" text-anchor="middle" class="name">JavaScript</text>

    <use href="#sql" x="330" y="137" width="34" height="34"/>
    <text x="347" y="192" text-anchor="middle" class="name">SQL</text>

    <text x="40" y="242" class="sub">CORE LANGUAGES / QUERYING</text>
  </g>

  <!-- 02 Backend and Data -->
  <g>
    <rect x="462" y="82" width="414" height="178" rx="5" class="panel"/>
    <rect x="462" y="82" width="414" height="37" rx="5" fill="url(#head)"/>
    <path d="M462 119H876" class="rule"/>
    <text x="478" y="105" class="idx">02</text>
    <text x="506" y="105" class="heading">BACKEND &amp; DATA</text>

    <use href="#fastapi" x="492" y="137" width="34" height="34"/>
    <text x="509" y="192" text-anchor="middle" class="name">FastAPI</text>

    <use href="#node" x="583" y="137" width="34" height="34"/>
    <text x="600" y="192" text-anchor="middle" class="name">Node.js</text>

    <use href="#postgres" x="674" y="137" width="34" height="34"/>
    <text x="691" y="192" text-anchor="middle" class="name">PostgreSQL</text>

    <use href="#pydantic" x="765" y="137" width="34" height="34"/>
    <text x="782" y="192" text-anchor="middle" class="name">Pydantic</text>

    <text x="478" y="242" class="sub">APIS / DATABASES / VALIDATION</text>
  </g>

  <!-- 03 Frontend and Visualization -->
  <g>
    <rect x="24" y="280" width="414" height="178" rx="5" class="panel"/>
    <rect x="24" y="280" width="414" height="37" rx="5" fill="url(#head)"/>
    <path d="M24 317H438" class="rule"/>
    <text x="40" y="303" class="idx">03</text>
    <text x="68" y="303" class="heading">FRONTEND &amp; VISUALIZATION</text>

    <use href="#react" x="51" y="335" width="34" height="34"/>
    <text x="68" y="390" text-anchor="middle" class="name">React</text>

    <use href="#three" x="144" y="335" width="34" height="34"/>
    <text x="161" y="390" text-anchor="middle" class="name">Three.js</text>

    <use href="#d3" x="237" y="335" width="34" height="34"/>
    <text x="254" y="390" text-anchor="middle" class="name">D3.js</text>

    <use href="#webui" x="330" y="335" width="34" height="34"/>
    <text x="347" y="390" text-anchor="middle" class="name">Web UI</text>

    <text x="40" y="440" class="sub">INTERFACES / 3D / DATA VIZ</text>
  </g>

  <!-- 04 Tools and Environment -->
  <g>
    <rect x="462" y="280" width="414" height="178" rx="5" class="panel"/>
    <rect x="462" y="280" width="414" height="37" rx="5" fill="url(#head)"/>
    <path d="M462 317H876" class="rule"/>
    <text x="478" y="303" class="idx">04</text>
    <text x="506" y="303" class="heading">TOOLS &amp; ENVIRONMENT</text>

    <use href="#git" x="481" y="335" width="30" height="34"/>
    <text x="496" y="390" text-anchor="middle" class="name">Git</text>

    <use href="#github" x="557" y="335" width="30" height="34"/>
    <text x="572" y="390" text-anchor="middle" class="name">GitHub</text>

    <use href="#vscode" x="633" y="335" width="30" height="34"/>
    <text x="648" y="390" text-anchor="middle" class="name">VS Code</text>

    <use href="#linux" x="709" y="335" width="30" height="34"/>
    <text x="724" y="390" text-anchor="middle" class="name">Linux</text>

    <use href="#docker" x="785" y="335" width="30" height="34"/>
    <text x="800" y="390" text-anchor="middle" class="name">Docker</text>

    <text x="478" y="440" class="sub">VERSION CONTROL / DEV ENVIRONMENT</text>
  </g>

  <!-- Footer -->
  <path d="M24 476H876" class="rule"/>
  <circle cx="29" cy="493" r="3" fill="#BEAED5"/>
  <text x="40" y="497" class="sub">STACK STATUS: EVOLVING</text>
  <text x="875" y="497" text-anchor="end" class="sub">BUILT FOR DATA / DESIGNED FOR DISCOVERY</text>
</svg>
