name: Update GitHub Signal

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/generate_github_signal.py"
      - ".github/workflows/update-github-signal.yml"

permissions:
  contents: write

jobs:
  generate-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate GitHub Signal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: otp-katana
        run: python scripts/generate_github_signal.py

      - name: Commit updated SVG
        run: |
          if git diff --quiet -- assets/github-signal.svg; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-signal.svg
          git commit -m "chore: update GitHub Signal"
          git push
