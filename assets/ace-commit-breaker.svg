
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D0C1A"/>
      <stop offset="1" stop-color="#08080F"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8D5EF"/>
      <stop offset=".55" stop-color="#AAA5B9"/>
      <stop offset="1" stop-color="#514B68"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#BEAED5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E8D5EF"/>
      <stop offset="1" stop-color="#BEAED5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#AAA5B9" stroke-opacity=".09" stroke-width=".7"/>
    </pattern>
    <g id="block">
      <path d="M0 3L3 0H17L20 3V17L17 20H3L0 17Z"
            fill="#BEAED5" fill-opacity=".18"
            stroke="#BEAED5" stroke-opacity=".8"/>
      <path d="M4 4H16V7H4Z" fill="#E8D5EF" fill-opacity=".65"/>
      <path d="M4 11H9V15H4Z" fill="#AAA5B9" fill-opacity=".6"/>
    </g>
    <g id="ship">
      <path d="M0 0L-25 -13L-18 -2L-27 5L-10 4L0 9L10 4L27 5L18 -2L25 -13Z"
            fill="url(#ship)" stroke="#E8D5EF" stroke-width="1"/>
      <path d="M-9 -2L0 -8L9 -2L5 2H-5Z" fill="#35304E" stroke="#BEAED5" stroke-width="1"/>
      <path d="M-4 4L0 12L4 4Z" fill="#BEAED5">
        <animate attributeName="opacity" values=".3;1;.4" dur=".22s" repeatCount="indefinite"/>
      </path>
      <path d="M-3 8L0 19L3 8Z" fill="#BEAED5" opacity=".7" filter="url(#glow)"/>
    </g>
  </defs>

  <!-- BACKGROUND -->
  <rect width="820" height="300" rx="12" fill="url(#bg)"/>
  <rect width="820" height="300" fill="url(#grid)"/>
  <ellipse cx="530" cy="155" rx="290" ry="135" fill="#BEAED5" opacity=".06"/>

  <!-- STARS -->
  <g fill="#E8D5EF">
    <circle cx="85" cy="82" r="1"/>
    <circle cx="170" cy="224" r="1.2"/>
    <circle cx="287" cy="70" r=".8"/>
    <circle cx="475" cy="48" r="1"/>
    <circle cx="740" cy="70" r="1.2"/>
    <circle cx="770" cy="230" r=".8"/>
    <circle cx="620" cy="255" r="1"/>
  </g>

  <!-- HEADER HUD -->
  <g font-family="monospace" fill="#AAA5B9" font-size="10" letter-spacing="1.5">
    <text x="25" y="28">ACE // COMMIT BREAKER</text>
    <text x="795" y="28" text-anchor="end" fill="#BEAED5">SYSTEM ONLINE</text>
    <text x="25" y="45" font-size="8" opacity=".7">ACTIVITY ARCADE / 01</text>
    <text x="795" y="45" font-size="8" text-anchor="end" opacity=".7">TARGET: CONTRIBUTIONS</text>
  </g>
  <path d="M25 56H795" stroke="#AAA5B9" stroke-opacity=".3"/>
  <path d="M25 56H95 M725 56H795" stroke="#BEAED5" stroke-width="1.5"/>

  <!-- CONTRIBUTION ENERGY BLOCKS -->
  <g id="commit-field">
    <g transform="translate(430 82)">
      <use href="#block" x="0"/>
      <use href="#block" x="27" opacity=".65"/>
      <use href="#block" x="54" opacity=".4"/>
      <use href="#block" x="81" opacity=".8"/>
      <use href="#block" x="108" opacity=".55"/>
      <use href="#block" x="135" opacity=".9"/>
      <use href="#block" x="162" opacity=".4"/>
      <use href="#block" x="189" opacity=".75"/>
    </g>
    <g transform="translate(430 109)">
      <use href="#block" opacity=".55"/>
      <use href="#block" x="27" opacity=".9"/>
      <use href="#block" x="54" opacity=".65"/>
      <use href="#block" x="81" opacity=".35"/>
      <use href="#block" x="108" opacity=".85"/>
      <use href="#block" x="135" opacity=".45"/>
      <use href="#block" x="162" opacity=".75"/>
      <use href="#block" x="189" opacity=".55"/>
    </g>
    <g transform="translate(430 136)">
      <use href="#block" opacity=".8"/>
      <use href="#block" x="27" opacity=".45"/>
      <use href="#block" x="54" opacity=".9"/>
      <use href="#block" x="81" opacity=".6"/>
      <use href="#block" x="108" opacity=".4"/>
      <use href="#block" x="135" opacity=".8"/>
      <use href="#block" x="162" opacity=".5"/>
      <use href="#block" x="189" opacity=".9"/>
    </g>
    <g transform="translate(430 163)">
      <use href="#block" opacity=".35"/>
      <use href="#block" x="27" opacity=".7"/>
      <use href="#block" x="54" opacity=".5"/>
      <use href="#block" x="81" opacity=".9"/>
      <use href="#block" x="108" opacity=".6"/>
      <use href="#block" x="135" opacity=".35"/>
      <use href="#block" x="162" opacity=".85"/>
      <use href="#block" x="189" opacity=".45"/>
    </g>
    <g transform="translate(430 190)">
      <use href="#block" opacity=".7"/>
      <use href="#block" x="27" opacity=".35"/>
      <use href="#block" x="54" opacity=".8"/>
      <use href="#block" x="81" opacity=".45"/>
      <use href="#block" x="108" opacity=".9"/>
      <use href="#block" x="135" opacity=".6"/>
      <use href="#block" x="162" opacity=".4"/>
      <use href="#block" x="189" opacity=".75"/>
    </g>
  </g>

  <!-- SHIP MOTION -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -5;0 0;0 3;0 0" dur="2.4s" repeatCount="indefinite"/>
    <use href="#ship" x="335" y="151"/>
  </g>

  <!-- LASER SHOTS -->
  <g>
    <rect x="352" y="147" width="88" height="3" rx="1.5" fill="#BEAED5" opacity=".3" filter="url(#glow)"/>
    <rect x="352" y="149" width="88" height="1.5" rx=".7" fill="url(#bolt)">
      <animate attributeName="x" values="350;400;350" dur=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur=".8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- TARGET IMPACT -->
  <g transform="translate(445 147)">
    <circle r="17" fill="#BEAED5" opacity="0" filter="url(#glow)">
      <animate attributeName="r" values="3;22;3" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.6;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M-12 0H12 M0 -12V12" stroke="#E8D5EF" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.08;.2;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- SHARDS -->
  <g fill="#E8D5EF" stroke="#BEAED5" stroke-width=".7">
    <path d="M0 0L8 -4L5 3Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="445 147;465 132;485 122" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 0L7 2L2 8Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="445 147;463 160;481 173" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 0L-7 3L-2 -7Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="445 147;428 132;414 117" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 0L-8 -2L-4 7Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="445 147;426 160;411 173" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- BOTTOM STATUS -->
  <path d="M25 245H795" stroke="#AAA5B9" stroke-opacity=".25"/>
  <g font-family="monospace" font-size="9" letter-spacing="1" fill="#AAA5B9">
    <text x="25" y="266">WEAPON: LAVENDER PULSE</text>
    <text x="410" y="266" text-anchor="middle" fill="#BEAED5">BREAK / REBUILD / REPEAT</text>
    <text x="795" y="266" text-anchor="end">CORE: STABLE</text>
  </g>
  <g fill="#BEAED5">
    <circle cx="26" cy="282" r="2"/>
    <circle cx="794" cy="282" r="2"/>
  </g>
  <path d="M34 282H140 M680 282H786" stroke="#BEAED5" stroke-opacity=".4"/>

  <rect x=".5" y=".5" width="819" height="299" rx="12" stroke="#AAA5B9" stroke-opacity=".4"/>
</svg>
