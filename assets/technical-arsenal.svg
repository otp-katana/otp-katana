    <g transform="translate(52 337)">
      <image href="https://cdn.simpleicons.org/react/61DAFB" width="34" height="34"/>
      <text x="17" y="51" text-anchor="middle" class="name">React</text>
    </g>
    <g transform="translate(145 337)">
      <image href="https://cdn.simpleicons.org/threedotjs/FFFFFF" width="34" height="34"/>
      <text x="17" y="51" text-anchor="middle" class="name">Three.js</text>
    </g>
    <g transform="translate(238 337)">
      <image href="https://cdn.simpleicons.org/d3/F9A03C" width="34" height="34"/>
      <text x="17" y="51" text-anchor="middle" class="name">D3.js</text>
    </g>
    <g transform="translate(331 337)">
