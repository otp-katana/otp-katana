        <ellipse cx="17" cy="8" rx="12" ry="4.5" fill="none" stroke="#BEAED5" stroke-width="1.6"/>
        <path d="M5 8V24C5 30 29 30 29 24V8M5 16C5 22 29 22 29 16M5 24C5 30 29 30 29 24" fill="none" stroke="#BEAED5" stroke-width="1.6"/>
      </svg>
      <text x="17" y="51" text-anchor="middle" class="name">SQL</text>
    </g>
    <text x="40" y="242" class="sub">CORE LANGUAGES / QUERYING</text>
