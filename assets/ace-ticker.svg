<svg xmlns="http://www.w3.org/2000/svg" width="520" height="76" viewBox="0 0 520 76">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100B19"/>
      <stop offset="100%" stop-color="#08080F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#E8D5EF"/>
    </linearGradient>
    <clipPath id="tickerClip">
      <rect x="151" y="5" width="360" height="66"/>
    </clipPath>
  </defs>

  <rect width="520" height="76" rx="7" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="519" height="75" rx="7"
        fill="none" stroke="#59416F" stroke-opacity="0.8"/>

  <path d="M0 1 H90" stroke="#C9A7FF" stroke-width="2"/>
  <path d="M1 0 V76" stroke="#A371F7" stroke-opacity="0.5"/>

  <!-- Fixed label -->
  <rect x="9" y="10" width="130" height="56" rx="3"
        fill="#211333" fill-opacity="0.75"
        stroke="#A371F7" stroke-opacity="0.55"/>

  <circle cx="22" cy="25" r="3" fill="#C9A7FF">
    <animate attributeName="opacity"
             values="1;0.35;1" dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="31" y="28" fill="#C9A7FF"
        font-family="monospace" font-size="9"
        letter-spacing="1.2">LANGUAGE</text>
  <text x="19" y="43" fill="#E8D5EF"
        font-family="monospace" font-size="10"
        font-weight="bold" letter-spacing="0.7">IDENTITY / 01</text>
  <path d="M19 52 H126" stroke="#A371F7"
        stroke-opacity="0.5"/>
  <text x="19" y="61" fill="#9B91AC"
        font-family="monospace" font-size="7.5"
        letter-spacing="1">A THOUGHT IN MOTION</text>

  <!-- Scrolling quote -->
  <g clip-path="url(#tickerClip)">
    <rect x="151" y="5" width="360" height="66"
          fill="#0C0912"/>

    <path d="M151 5 H511" stroke="#A371F7"
          stroke-opacity="0.25"/>
    <path d="M151 71 H511" stroke="#A371F7"
          stroke-opacity="0.25"/>

    <g>
      <animateTransform attributeName="transform"
                        type="translate"
                        from="0 0" to="-3900 0"
                        dur="110s"
                        repeatCount="indefinite"/>

      <text x="0" y="39" fill="#E8D5EF"
            font-family="'Segoe UI', 'Helvetica Neue', sans-serif"
            dominant-baseline="middle"
            font-size="13"
            font-weight="500"
            letter-spacing="0.15">
        Dil olmazsa kültür olmaz. Kültür olmazsa kimlik, kimlik olmazsa haysiyet, onur olmaz. O halde Türk Devletinin birinci görevi Türk adını, varlığını, kimliğini korumak, tarihten silinmesini önlemek olacağına göre, Türk Devletinin başta gelen işi, milli savunma görevi, Türk dilini yaşatmak, gelişmesine destek olmak, onun için de eğitimini Türkçe yapmak, her dalda, edebiyatta, bilim ve teknikte Türkçe telif ve tercüme eserleri teşvik etmek, olmalıdır. ◇
      </text>

      <text x="3900" y="39" fill="#E8D5EF"
            font-family="'Segoe UI', 'Helvetica Neue', sans-serif"
            dominant-baseline="middle"
            font-size="13"
            font-weight="500"
            letter-spacing="0.15">
        Dil olmazsa kültür olmaz. Kültür olmazsa kimlik, kimlik olmazsa haysiyet, onur olmaz. O halde Türk Devletinin birinci görevi Türk adını, varlığını, kimliğini korumak, tarihten silinmesini önlemek olacağına göre, Türk Devletinin başta gelen işi, milli savunma görevi, Türk dilini yaşatmak, gelişmesine destek olmak, onun için de eğitimini Türkçe yapmak, her dalda, edebiyatta, bilim ve teknikte Türkçe telif ve tercüme eserleri teşvik etmek, olmalıdır. ◇
      </text>
    </g>
  </g>

  <text x="506" y="14" text-anchor="end"
        fill="#A371F7" font-family="monospace"
        font-size="7" letter-spacing="1">LIVE FEED</text>
</svg>
