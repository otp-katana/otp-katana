
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0C1A"/>
      <stop offset="100%" stop-color="#08080F"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BEAED5" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#BEAED5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#AAA5B9" stroke-opacity=".07" stroke-width=".7"/>
    </pattern>
    <style>
      .panel { fill:#0D0C1A; stroke:#AAA5B9; stroke-opacity:.48; stroke-width:1; }
      .heading { fill:#FFFFFF; font:600 13px monospace; letter-spacing:1.8px; }
      .sub { fill:#AAA5B9; font:10px monospace; letter-spacing:1.2px; }
      .name { fill:#E8D5EF; font:11px monospace; }
      .index { fill:#BEAED5; font:10px monospace; letter-spacing:1px; }
      .rule { stroke:#AAA5B9; stroke-opacity:.35; stroke-width:1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="510" rx="8" fill="url(#bg)"/>
  <rect width="900" height="510" rx="8" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="899" height="509" rx="8" fill="none" stroke="#AAA5B9" stroke-opacity=".6"/>

  <!-- Header -->
  <rect x="1" y="1" width="898" height="62" rx="7" fill="url(#header)"/>
  <path d="M24 63H876" class="rule"/>
  <rect x="24" y="20" width="3" height="25" fill="#BEAED5"/>
  <text x="38" y="30" class="heading" font-size="15">TECHNICAL ARSENAL</text>
  <text x="38" y="47" class="sub">SYSTEM CAPABILITIES / ACTIVE STACK</text>
  <text x="875" y="28" text-anchor="end" class="index">ACE // 02</text>
  <text x="875" y="45" text-anchor="end" class="sub">17 TECHNOLOGIES</text>

