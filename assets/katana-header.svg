
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320"
     viewBox="0 0 1200 320"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08080F"/>
      <stop offset=".52" stop-color="#100D1C"/>
      <stop offset="1" stop-color="#08080F"/>
    </linearGradient>

    <linearGradient id="panelGlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#BEAED5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#BEAED5" stop-opacity=".2"/>
      <stop offset="1" stop-color="#BEAED5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8D5EF"/>
      <stop offset=".5" stop-color="#BEAED5"/>
      <stop offset="1" stop-color="#AAA5B9"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24"
             patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24"
            fill="none" stroke="#AAA5B9"
            stroke-opacity=".055"/>
    </pattern>

    <pattern id="microGrid" width="4" height="4"
             patternUnits="userSpaceOnUse">
      <path d="M4 0H0V4"
            fill="none" stroke="#BEAED5"
            stroke-opacity=".07" stroke-width=".5"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="panel">
      <rect width="1200" height="320" rx="7"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel)">

    <!-- Base -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#microGrid)" opacity=".35"/>

    <!-- Angular background plates -->
    <path d="M0 0H345L275 70H0Z"
          fill="#0D0C1A"/>
    <path d="M1200 0H920L1005 70H1200Z"
          fill="#0D0C1A"/>
    <path d="M0 320V257L90 190H220L150 320Z"
          fill="#0D0C1A" opacity=".9"/>
    <path d="M1200 320V255L1110 190H980L1050 320Z"
          fill="#0D0C1A" opacity=".9"/>

   
     <!-- CYBERNETIC DIMENSION GATE -->
     
<!-- DIMENSION GATE: FRACTURE SEQUENCE -->
<g id="dimension-gate">

  <!-- Dark opening behind the shards -->
  <path d="M470 69H730L804 112V208L730 251H470L396 208V112Z"
        fill="#08080F" stroke="#BEAED5"
        stroke-opacity=".55" stroke-width="1.5"/>

  <!-- Inner depth aperture -->
  <path d="M510 91H690L750 126V194L690 229H510L450 194V126Z"
        fill="#0D0C1A" stroke="#AAA5B9"
        stroke-opacity=".35"/>

  <!-- Upper-left shard -->
  <polygon points="470,69 535,69 570,112 510,126 450,112 396,112"
           fill="#151124" stroke="#BEAED5" stroke-opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -17 -13; -17 -13; 0 0"
      keyTimes="0;0.2;0.72;1" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="1;1;.82;1" dur="4.8s" repeatCount="indefinite"/>
  </polygon>

  <!-- Upper-center shard -->
  <polygon points="535,69 665,69 690,91 630,112 570,112"
           fill="#211832" stroke="#E8D5EF" stroke-opacity=".7">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -19; 0 -19; 0 0"
      keyTimes="0;0.2;0.72;1" dur="4.8s"
      begin=".04s" repeatCount="indefinite"/>
  </polygon>

  <!-- Upper-right shard -->
  <polygon points="665,69 730,69 804,112 750,126 690,112"
           fill="#171226" stroke="#BEAED5" stroke-opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 18 -12; 18 -12; 0 0"
      keyTimes="0;0.2;0.72;1" dur="4.8s"
      begin=".08s" repeatCount="indefinite"/>
  </polygon>

  <!-- Left-side shard -->
  <polygon points="396,112 450,112 510,126 510,160 450,176 396,208"
           fill="#171226" stroke="#BEAED5" stroke-opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -24 0; -24 0; 0 0"
      keyTimes="0;0.2;0.72;1" dur="4.8s"
      begin=".02s" repeatCount="indefinite"/>
  </polygon>

  <!-- Right-side shard -->
  <polygon points="690,112 750,126 804,112 804,208 750,176 690,160"
           fill="#171226" stroke="#BEAED5" stroke-opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 24 0; 24 0; 0 0"
      keyTimes="0;0.2;0.72;1" dur="4.8s"
      begin=".06s" repeatCount="indefinite"/>
  </polygon>

  <!-- Lower-left shard -->
  <polygon points="396,208 450,176 510,194 570,208 535,251 470,251"
           fill="#211832" stroke="#BEAED5" stroke-opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -17 14; -17 14; 0 0"
      keyTimes="0;0.2;0.72;1" dur="4.8s"
      begin=".1s" repeatCount="indefinite"/>
  </polygon>

  <!-- Lower-center shard -->
  <polygon points="510,194 570,208 630,208 690,229 665,251 535,251"
           fill="#151124" stroke="#E8D5EF" stroke-opacity=".65">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 19; 0 19; 0 0"
      keyTimes="0;0.2;0.72;1" dur="4.8s"
      begin=".05s" repeatCount="indefinite"/>
  </polygon>

  <!-- Lower-right shard -->
  <polygon points="690,160 750,176 804,208 730,251 665,251 630,208"
           fill="#171226" stroke="#BEAED5" stroke-opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 18 14; 18 14; 0 0"
      keyTimes="0;0.2;0.72;1" dur="4.8s"
      begin=".12s" repeatCount="indefinite"/>
  </polygon>

  <!-- Energy flash across the aperture -->
  <path d="M450 160H750"
        fill="none" stroke="#E8D5EF" stroke-width="2"
        stroke-linecap="square" opacity="0">
    <animate attributeName="opacity"
      values="0;0;1;.15;0;0"
      keyTimes="0;.16;.21;.29;.4;1"
      dur="4.8s" repeatCount="indefinite"/>
  </path>

  <!-- Fine energy fracture -->
  <path d="M530 103L578 145L558 167L620 188L670 218"
        fill="none" stroke="#BEAED5" stroke-width="1.5"
        stroke-linecap="square" opacity=".2">
    <animate attributeName="opacity"
      values=".2;.2;1;.3;.2"
      keyTimes="0;.16;.23;.38;1"
      dur="4.8s" repeatCount="indefinite"/>
  </path>

</g>



    <!-- Circuit traces: left -->
    <g fill="none" stroke="#BEAED5"
       stroke-width="1" stroke-opacity=".42">
      <path d="M0 84H105L137 116H218"/>
      <path d="M0 98H91L124 131H186"/>
      <path d="M0 112H70L98 140H158"/>
      <path d="M0 230H95L129 196H204"/>
      <path d="M0 245H113L145 213H225"/>
      <path d="M40 0V29L66 55V70"/>
      <path d="M177 0V22L196 41V58"/>
    </g>

    <!-- Circuit traces: right -->
    <g fill="none" stroke="#BEAED5"
       stroke-width="1" stroke-opacity=".42">
      <path d="M1200 84H1095L1063 116H982"/>
      <path d="M1200 98H1109L1076 131H1014"/>
      <path d="M1200 112H1130L1102 140H1042"/>
      <path d="M1200 230H1105L1071 196H996"/>
      <path d="M1200 245H1087L1055 213H975"/>
      <path d="M1160 0V29L1134 55V70"/>
      <path d="M1023 0V22L1004 41V58"/>
    </g>

    <!-- Circuit nodes -->
    <g fill="#E8D5EF">
      <circle cx="105" cy="84" r="2"/>
      <circle cx="218" cy="116" r="2"/>
      <circle cx="91" cy="98" r="1.5"/>
      <circle cx="204" cy="230" r="2"/>
      <circle cx="1095" cy="84" r="2"/>
      <circle cx="982" cy="116" r="2"/>
      <circle cx="1109" cy="98" r="1.5"/>
      <circle cx="996" cy="230" r="2"/>
    </g>

    <!-- Peripheral data markers -->
    <g stroke="#AAA5B9" stroke-opacity=".3" fill="none">
      <path d="M50 150H142 M50 156H105 M50 162H126"/>
      <path d="M1150 150H1058 M1150 156H1095 M1150 162H1074"/>
      <path d="M62 175H116 M62 181H94"/>
      <path d="M1138 175H1084 M1138 181H1106"/>
    </g>

    <!-- Outer chassis -->
    <rect x="18" y="18" width="1164" height="284" rx="4"
          fill="none" stroke="#AAA5B9"
          stroke-opacity=".42"/>

    <path d="M19 64V19H106
             M1094 19H1181V64
             M19 256V301H106
             M1094 301H1181V256"
          fill="none" stroke="url(#edge)"
          stroke-width="1.5"/>

    <!-- Corner accents: kept away from text -->
    <g fill="none" stroke="#BEAED5"
       stroke-width="2" stroke-linecap="square">
      <path d="M30 49V30H49"/>
      <path d="M1151 30H1170V49"/>
      <path d="M30 271V290H49"/>
      <path d="M1151 290H1170V271"/>
    </g>

    <!-- Top status strip -->
    <path d="M62 80H1138"
          stroke="url(#edge)" stroke-opacity=".65"/>

    <path d="M62 80H290"
          stroke="#E8D5EF" stroke-width="1.5"/>

    <g font-family="monospace" font-size="10"
       letter-spacing="1.8">
      <text x="70" y="58" fill="#BEAED5">ACE / IDENTITY.SYS</text>
      <text x="1130" y="58" fill="#AAA5B9"
            text-anchor="end">K-001 // PROFILE</text>
    </g>

    <!-- Small system markers -->
    <g fill="#BEAED5">
      <rect x="70" y="90" width="5" height="5"/>
      <rect x="79" y="90" width="5" height="5" opacity=".5"/>
      <rect x="88" y="90" width="5" height="5" opacity=".25"/>
      <rect x="1107" y="90" width="5" height="5" opacity=".25"/>
      <rect x="1116" y="90" width="5" height="5" opacity=".5"/>
      <rect x="1125" y="90" width="5" height="5"/>
    </g>

    <!-- Name backing and subtle light -->
    <path d="M360 98H840L820 190H380Z"
          fill="url(#panelGlow)" opacity=".55"/>

    <!-- Main identity -->
    <text x="600" y="157"
          font-family="Orbitron, Rajdhani, Arial, sans-serif"
          font-size="82" font-weight="900"
          letter-spacing="3"
          fill="#FFFFFF"
          text-anchor="middle">katana.</text>

    <!-- Name underline -->
    <path d="M464 178H736"
          stroke="#BEAED5" stroke-width="1.5"
          filter="url(#glow)"/>

    <path d="M464 184H510 M690 184H736"
          stroke="#AAA5B9" stroke-opacity=".55"/>

    <!-- Role -->
    <text x="600" y="214"
          font-family="Orbitron, Rajdhani, Arial, sans-serif"
          font-size="21" font-weight="700"
          letter-spacing="4"
          fill="#E8D5EF"
          text-anchor="middle">DATA ENGINEER</text>

    <!-- Specialization -->
    <text x="600" y="241"
          font-family="monospace"
          font-size="11" letter-spacing="2.6"
          fill="#AAA5B9"
          text-anchor="middle">DATA / SYSTEMS / ARCHITECTURE</text>

    <!-- Bottom status strip -->
    <path d="M62 259H1138"
          stroke="#AAA5B9" stroke-opacity=".3"/>

    <path d="M62 259H280"
          stroke="#BEAED5" stroke-opacity=".75"/>

    <circle cx="73" cy="280" r="3" fill="#E8D5EF"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values=".35;1;.35"
               dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <text x="86" y="284"
          font-family="monospace" font-size="10"
          letter-spacing="1.4"
          fill="#BEAED5">SYSTEM ONLINE</text>

    <text x="1138" y="284"
          font-family="monospace" font-size="10"
          letter-spacing="1.4"
          fill="#AAA5B9" text-anchor="end">BUILDING THE UNKNOWN</text>

    <!-- Moving scan beam -->
    <rect x="20" y="18" width="1160" height="18"
          fill="url(#panelGlow)" opacity=".45">
      <animate attributeName="y"
               values="18;284;18"
               dur="10s" repeatCount="indefinite"/>
    </rect>

    <!-- Fine terminal scanlines -->
    <g stroke="#FFFFFF" stroke-opacity=".025">
      <path d="M20 105H1180"/>
      <path d="M20 109H1180"/>
      <path d="M20 113H1180"/>
      <path d="M20 217H1180"/>
      <path d="M20 221H1180"/>
      <path d="M20 225H1180"/>
    </g>

  </g>
</svg>
