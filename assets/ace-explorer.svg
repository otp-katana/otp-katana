
<svg xmlns="http://www.w3.org/2000/svg"
     width="440" height="270" viewBox="0 0 440 270">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080F"/>
      <stop offset="100%" stop-color="#171326"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BEAED5" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#BEAED5" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="mapClip">
      <circle cx="151" cy="137" r="84"/>
    </clipPath>
  </defs>

  <!-- Panel -->
  <rect width="440" height="270" rx="8" fill="url(#bg)"/>
  <rect x="8" y="8" width="424" height="254" rx="5"
        fill="none" stroke="#AAA5B9" stroke-opacity=".28"/>

  <!-- Header -->
  <g font-family="monospace">
    <text x="20" y="29" font-size="10"
          letter-spacing="1.5" fill="#E8D5EF">ACE EXPLORER</text>
    <text x="420" y="29" font-size="8"
          text-anchor="end" fill="#AAA5B9">SPATIAL SCAN / 02</text>
  </g>

  <path d="M20 39H420" stroke="#AAA5B9" stroke-opacity=".25"/>

  <!-- Globe grid -->
  <g clip-path="url(#mapClip)">
    <circle cx="151" cy="137" r="84"
            fill="#BEAED5" fill-opacity=".035"/>

    <g fill="none" stroke="#AAA5B9" stroke-opacity=".35"
       stroke-width=".7">
      <circle cx="151" cy="137" r="84"/>
      <ellipse cx="151" cy="137" rx="25" ry="84"/>
      <ellipse cx="151" cy="137" rx="53" ry="84"/>
      <ellipse cx="151" cy="137" rx="84" ry="25"/>
      <ellipse cx="151" cy="137" rx="84" ry="53"/>
      <path d="M67 137H235M151 53V221"/>
    </g>

    <!-- Stylized terrain contours -->
    <g fill="#BEAED5" fill-opacity=".08"
       stroke="#BEAED5" stroke-opacity=".7" stroke-width=".8">
      <path d="M102 91L119 80L136 87L141 101L131 113
               L119 117L114 131L102 125L94 108Z"/>
      <path d="M126 137L140 143L148 160L142 179
               L132 195L126 178L121 160Z"/>
      <path d="M157 91L176 83L194 96L205 108
               L194 119L179 115L171 127L160 115Z"/>
      <path d="M174 135L188 132L199 145L192 164
               L180 176L170 159Z"/>
    </g>

    <!-- Rotating radar sweep -->
    <g transform="translate(151 137)">
      <path d="M0 0L0 -84
               A84 84 0 0 1 72.7 42Z"
            fill="url(#scan)"/>
      <line x1="0" y1="0" x2="0" y2="-84"
            stroke="#E8D5EF" stroke-width="1.2"
            stroke-opacity=".9" filter="url(#glow)"/>
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 0 0" to="360 0 0"
                        dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- Scan target -->
    <g>
      <circle cx="184" cy="111" r="8"
              fill="none" stroke="#E8D5EF" stroke-opacity=".75">
        <animate attributeName="r"
                 values="5;12;5" dur="2.2s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="1;.15;1" dur="2.2s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="184" cy="111" r="3"
              fill="#FFFFFF" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Globe rim -->
  <circle cx="151" cy="137" r="84"
          fill="none" stroke="#BEAED5"
          stroke-opacity=".65" stroke-width="1"/>

  <!-- Target connector -->
  <path d="M190 107L224 83H247"
        fill="none" stroke="#BEAED5"
        stroke-width=".9" stroke-opacity=".85"/>

  <circle cx="247" cy="83" r="2" fill="#E8D5EF"/>

  <!-- Target data card -->
  <rect x="222" y="92" width="191" height="91" rx="4"
        fill="#100F1D" fill-opacity=".94"
        stroke="#BEAED5" stroke-opacity=".42"/>

  <g font-family="monospace">
    <text x="234" y="108" font-size="8"
          letter-spacing="1" fill="#AAA5B9">SELECTED LOCATION</text>

    <text x="234" y="127" font-size="12"
          font-weight="bold" fill="#FFFFFF">EVENT NODE 07</text>

    <path d="M234 136H401" stroke="#AAA5B9" stroke-opacity=".2"/>

    <text x="234" y="151" font-size="8" fill="#AAA5B9">LAT</text>
    <text x="269" y="151" font-size="8" fill="#E8D5EF">38.42° N</text>

    <text x="234" y="166" font-size="8" fill="#AAA5B9">LON</text>
    <text x="269" y="166" font-size="8" fill="#E8D5EF">27.14° E</text>
  </g>

  <!-- Status and legend -->
  <path d="M20 233H420" stroke="#AAA5B9" stroke-opacity=".25"/>

  <circle cx="26" cy="247" r="3" fill="#BEAED5">
    <animate attributeName="opacity"
             values=".3;1;.3" dur="1.8s"
             repeatCount="indefinite"/>
  </circle>

  <g font-family="monospace" font-size="8" letter-spacing=".6">
    <text x="36" y="250" fill="#E8D5EF">SCANNING</text>
    <text x="220" y="250" fill="#AAA5B9" text-anchor="middle">SPATIAL DATA</text>
    <text x="420" y="250" fill="#AAA5B9" text-anchor="end">ACE / EXPLORER</text>
  </g>
</svg>
