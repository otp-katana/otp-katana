          dur=".38s" repeatCount="indefinite"/>
        <animate attributeName="opacity"
          values="1;1;0;0"
          keyTimes="0;0.978;0.980;1"
          dur="12s" repeatCount="indefinite"/>
        <animateMotion
          path="M-22 70 H842"
          dur="12s" repeatCount="indefinite" rotate="auto"/>
      </path>
    </g>
    
    <!-- Ghost 1 -->
