
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0C1A"/>
      <stop offset="1" stop-color="#08080F"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BEAED5" stop-opacity=".17"/>
      <stop offset="1" stop-color="#BEAED5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#AAA5B9" stroke-opacity=".07"/>
    </pattern>
    <style>
      .panel{fill:#0D0C1A;stroke:#AAA5B9;stroke-opacity:.48}
      .heading{fill:#FFFFFF;font:600 13px monospace;letter-spacing:1.4px}
      .sub{fill:#AAA5B9;font:10px monospace;letter-spacing:1px}
      .name{fill:#E8D5EF;font:11px monospace}
      .idx{fill:#BEAED5;font:10px monospace;letter-spacing:1px}
      .rule{stroke:#AAA5B9;stroke-opacity:.32;fill:none}
    </style>

    <!-- Python-inspired mark -->
    <g id="python">
      <path d="M17 3C11 3 9 5 9 9V14H22V16H8C4 16 3 13 3 10C3 5 7 2 14 2H20V5H17Z" fill="#3776AB"/>
      <path d="M17 29C23 29 25 27 25 23V18H12V16H26C30 16 31 19 31 22C31 27 27 30 20 30H14V27H17Z" fill="#FFD343"/>
      <circle cx="14" cy="7" r="1.3" fill="#FFFFFF"/>
      <circle cx="20" cy="25" r="1.3" fill="#FFFFFF"/>
    </g>

    <!-- C++ mark -->
    <g id="cpp">
      <path d="M17 2L29 9V23L17 30L5 23V9Z" fill="#00599C"/>
      <path d="M19 12H25M22 9V15M19 20H25M22 17V23" stroke="#FFFFFF" stroke-width="1.8"/>
      <path d="M15 10L10 10L7 16L10 22H15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- JavaScript mark -->
    <g id="javascript">
      <rect x="2" y="2" width="30" height="30" rx="2" fill="#F7DF1E"/>
      <path d="M17 10V23C17 27 14 29 10 27L12 23C14 24 14 24 14 22V10Z" fill="#171717"/>
      <path d="M20 24C22 27 26 27 27 24C27 22 24 22 22 20C18 17 21 12 25 12C28 12 30 14 30 14L28 18C26 16 24 16 24 18C24 19 27 20 29 22C33 27 28 31 24 31C21 31 19 29 18 27Z" fill="#171717"/>
    </g>

    <!-- SQL / database -->
    <g id="sql">
      <ellipse cx="17" cy="7" rx="12" ry="4.5" fill="#BEAED5"/>
      <path d="M5 7V25C5 31 29 31 29 25V7" fill="none" stroke="#BEAED5" stroke-width="2"/>
      <path d="M5 16C5 22 29 22 29 16M5 24C5 30 29 30 29 24" fill="none" stroke="#0D0C1A" stroke-width="1.5"/>
    </g>

    <!-- FastAPI-inspired lightning -->
    <g id="fastapi">
      <path d="M20 1L5 18H15L11 32L29 12H19Z" fill="#009688"/>
      <path d="M20 1L5 18H15L11 32" fill="none" stroke="#D7FFF7" stroke-width="1"/>
    </g>

    <!-- Node.js -->
    <g id="node">
      <path d="M17 2L30 9.5V24.5L17 32L4 24.5V9.5Z" fill="none" stroke="#339933" stroke-width="2.5"/>
      <path d="M12 12V22L17 25L22 22V12L17 9Z" fill="#339933"/>
      <path d="M17 13V21" stroke="#FFFFFF" stroke-width="1.6"/>
    </g>

    <!-- PostgreSQL-inspired elephant silhouette -->
    <g id="postgres">
      <path d="M8 10C8 5 13 3 19 4C25 5 27 9 26 15L25 22L21 25L18 22L17 16L14 16L13 24L9 24L9 16C6 14 5 12 8 10Z" fill="#4169E1"/>
      <path d="M24 10C29 9 31 12 29 16L26 18L24 15" fill="none" stroke="#4169E1" stroke-width="3" stroke-linecap="round"/>
      <circle cx="21" cy="9" r="1.4" fill="#FFFFFF"/>
      <path d="M8 11L3 14L8 16" fill="none" stroke="#4169E1" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Pydantic -->
    <g id="pydantic">
      <path d="M17 2L29 9V23L17 30L5 23V9Z" fill="none" stroke="#E92063" stroke-width="2.5"/>
      <path d="M12 24V9H19C26 9 26 18 19 18H12" fill="none" stroke="#E92063" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- React atom -->
    <g id="react">
      <circle cx="17" cy="17" r="2.8" fill="#61DAFB"/>
      <g fill="none" stroke="#61DAFB" stroke-width="1.7">
        <ellipse cx="17" cy="17" rx="15" ry="6"/>
        <ellipse cx="17" cy="17" rx="15" ry="6" transform="rotate(60 17 17)"/>
        <ellipse cx="17" cy="17" rx="15" ry="6" transform="rotate(120 17 17)"/>
      </g>
    </g>

    <!-- Three.js-inspired wireframe -->
    <g id="three">
      <path d="M17 2L31 10V25L17 32L3 24V9Z" fill="none" stroke="#E8D5EF" stroke-width="1.8"/>
      <path d="M17 2V17L31 10M17 17L3 9M17 17V32M17 17L31 25M17 17L3 24" fill="none" stroke="#AAA5B9" stroke-width="1.4"/>
      <circle cx="17" cy="17" r="2" fill="#BEAED5"/>
    </g>

    <!-- D3-inspired data graph -->
    <g id="d3">
      <path d="M4 28V5M4 28H31" stroke="#AAA5B9" stroke-width="1.5" fill="none"/>
      <path d="M7 23L13 17L19 20L27 7" stroke="#F9A03C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7" cy="23" r="2" fill="#F9A03C"/>
      <circle cx="13" cy="17" r="2" fill="#F9A03C"/>
      <circle cx="19" cy="20" r="2" fill="#F9A03C"/>
      <circle cx="27" cy="7" r="2" fill="#F9A03C"/>
    </g>

    <!-- Web interface -->
    <g id="webui">
      <rect x="2" y="4" width="30" height="25" rx="3" fill="none" stroke="#BEAED5" stroke-width="1.8"/>
      <path d="M2 11H32" stroke="#BEAED5" stroke-width="1.5"/>
      <circle cx="7" cy="8" r="1" fill="#E8D5EF"/>
      <circle cx="11" cy="8" r="1" fill="#E8D5EF"/>
      <path d="M8 16L13 20L8 24M17 24H25" fill="none" stroke="#E8D5EF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Git branch -->
    <g id="git">
      <path d="M8 5V26M8 12C8 18 25 11 25 19V26" fill="none" stroke="#F05032" stroke-width="3" stroke-linecap="round"/>
      <circle cx="8" cy="5" r="4" fill="#F05032"/>
      <circle cx="8" cy="26" r="4" fill="#F05032"/>
      <circle cx="25" cy="26" r="4" fill="#F05032"/>
      <circle cx="8" cy="5" r="1.3" fill="#FFFFFF"/>
      <circle cx="8" cy="26" r="1.3" fill="#FFFFFF"/>
      <circle cx="25" cy="26" r="1.3" fill="#FFFFFF"/>
    </g>

