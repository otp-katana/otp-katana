<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D0C1A"/>
      <stop offset="1" stop-color="#08080F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111020"/>
      <stop offset="1" stop-color="#0A0913"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8D5EF"/>
      <stop offset="1" stop-color="#AAA5B9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#AAA5B9" stroke-opacity=".055" stroke-width=".7"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .heading { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #E8D5EF; }
      .muted { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #AAA5B9; }
      .skill { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #FFFFFF; }
      .tiny { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 9px; letter-spacing: 1px; fill: #AAA5B9; }
      .frame { fill: url(#panel); stroke: #AAA5B9; stroke-opacity: .27; stroke-width: 1; }
      .chip { fill: #0D0C1A; stroke: #AAA5B9; stroke-opacity: .23; stroke-width: 1; }
      .glyph { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #E8D5EF; text-anchor: middle; }
    </style>
  </defs>

  <!-- Main chassis -->
  <rect x=".5" y=".5" width="899" height="509" rx="5" fill="url(#bg)" stroke="#AAA5B9" stroke-opacity=".5"/>
  <rect x="1" y="1" width="898" height="508" rx="5" fill="url(#grid)"/>

  <!-- Corner registration marks -->
  <path d="M1 36H13M1 36V48M899 36H887M899 36V48M1 474H13M1 474V462M899 474H887M899 474V462"
        stroke="#BEAED5" stroke-width="1.2"/>

  <!-- Header -->
