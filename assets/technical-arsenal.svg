    <path d="M24 119H438" class="rule"/>
    <rect x="24" y="82" width="414" height="37" rx="5" fill="url(#header)"/>
    <text x="40" y="105" class="index">01</text>
    <text x="68" y="105" class="heading">PROGRAMMING LANGUAGES</text>

    <g transform="translate(52 139)">
      <image href="https://cdn.simpleicons.org/python/3776AB" width="34" height="34"/>
      <text x="17" y="51" text-anchor="middle" class="name">Python</text>
    </g>
    <g transform="translate(145 139)">
      <image href="https://cdn.simpleicons.org/cplusplus/00599C" width="34" height="34"/>
      <text x="17" y="51" text-anchor="middle" class="name">C++</text>
    </g>
    <g transform="translate(238 139)">
      <image href="https://cdn.simpleicons.org/javascript/F7DF1E" width="34" height="34"/>
      <text x="17" y="51" text-anchor="middle" class="name">JavaScript</text>
    </g>
    <g transform="translate(331 139)">
