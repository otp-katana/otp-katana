
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330">
  <defs>
    <linearGradient id="aceBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12101A"/>
      <stop offset="1" stop-color="#08080F"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#BEAED5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#BEAED5" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="170" cy="155" r="96"/>
    </clipPath>
    <clipPath id="nodeReveal">
      <rect x="300" y="70" width="195" height="0">
        <animate attributeName="height"
          values="0;105;105;105;0;0"
          keyTimes="0;.12;.72;.79;.89;1"
          dur="6.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="520" height="330" rx="8" fill="url(#aceBg)"/>
  <rect x=".5" y=".5" width="519" height="329" rx="7.5"
        fill="none" stroke="#BEAED5" stroke-opacity=".45"/>
  <path d="M1 1 H115" stroke="#E8D5EF" stroke-width="1.5"/>
  <path d="M0 35 H520" stroke="#BEAED5" stroke-opacity=".25"/>

  <text x="18" y="22" fill="#E8D5EF" font-family="Arial, sans-serif"
        font-size="11" font-weight="600" letter-spacing="2">ACE / EXPLORER</text>
  <text x="502" y="22" fill="#BEAED5" text-anchor="end"
        font-family="monospace" font-size="8">SPATIAL INTERFACE</text>

  <!-- Globe -->
  <circle cx="170" cy="155" r="100" fill="#08080F"
          stroke="#BEAED5" stroke-opacity=".55"/>
  <circle cx="170" cy="155" r="96" fill="none"
          stroke="#E8D5EF" stroke-opacity=".45"/>

  <g clip-path="url(#globeClip)" fill="none"
     stroke="#BEAED5" stroke-opacity=".48">
    <ellipse cx="170" cy="155" rx="43" ry="96"/>
    <ellipse cx="170" cy="155" rx="76" ry="96"/>
    <ellipse cx="170" cy="155" rx="96" ry="35"/>
    <ellipse cx="170" cy="155" rx="96" ry="66"/>
    <path d="M74 155 H266 M170 59 V251"/>
    <path d="M87 111 Q170 140 253 111"/>
    <path d="M87 199 Q170 170 253 199"/>
  </g>

  <!-- Illustrative land contours -->
  <g clip-path="url(#globeClip)" fill="#BEAED5" fill-opacity=".09"
     stroke="#E8D5EF" stroke-opacity=".8" stroke-width="1">
    <path d="M111 92 L133 82 145 91 141 108 154 119
             144 133 127 129 119 145 104 136 98 116 Z"/>
    <path d="M153 147 L170 139 185 150 183 168
             195 180 185 201 172 218 162 199
             165 181 151 168 Z"/>
    <path d="M198 95 L220 101 232 119 223 133
             205 127 193 113 Z"/>
    <path d="M210 157 L234 148 248 164 238 184
             222 190 209 177 Z"/>
  </g>

  <!-- Orbital rings -->
  <ellipse cx="170" cy="155" rx="119" ry="35"
           transform="rotate(-24 170 155)"
           fill="none" stroke="#BEAED5" stroke-width="1.3">
    <animateTransform attributeName="transform" type="rotate"
      from="-24 170 155" to="336 170 155"
      dur="32s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="170" cy="155" rx="113" ry="48"
           transform="rotate(45 170 155)"
           fill="none" stroke="#BEAED5" stroke-opacity=".6">
    <animateTransform attributeName="transform" type="rotate"
      from="45 170 155" to="-315 170 155"
      dur="46s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Radar -->
  <path d="M170 155 L170 59 A96 96 0 0 1 250 102 Z"
        fill="url(#radarSweep)" clip-path="url(#globeClip)">
    <animateTransform attributeName="transform" type="rotate"
      from="0 170 155" to="360 170 155"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Target -->
  <circle cx="194" cy="132" r="11" fill="none"
          stroke="#E8D5EF" stroke-width="1.2">
    <animate attributeName="r" values="7;14;7"
      dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.3;1"
      dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="194" cy="132" r="3" fill="#E8D5EF"/>
  <path d="M194 117 V126 M194 138 V147 M179 132 H188 M200 132 H209"
        stroke="#E8D5EF"/>

  <text x="170" y="278" fill="#BEAED5" font-family="monospace"
        font-size="8" text-anchor="middle" letter-spacing="1.4">
    GLOBAL SPATIAL SCAN
  </text>

  <!-- Connector -->
  <path d="M206 132 L280 132 L300 150"
        fill="none" stroke="#BEAED5" stroke-opacity=".8"
        stroke-dasharray="3 4"/>
  <circle cx="280" cy="132" r="2" fill="#E8D5EF"/>

  <!-- System window: opens, glitches, disintegrates -->
  <g clip-path="url(#nodeReveal)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;4 0;-5 1;3 -1;0 0;0 0"
        keyTimes="0;.70;.73;.76;.79;.82;1"
        dur="6.8s" repeatCount="indefinite"/>

      <rect x="300" y="70" width="195" height="105" rx="2"
            fill="#08080F" fill-opacity=".97"
            stroke="#BEAED5" stroke-width="1.2"/>

      <path d="M300 88 H495" stroke="#BEAED5" stroke-opacity=".7"/>
      <path d="M300 70 H345 M300 70 V84 M495 70 H480 M495 70 V84
               M300 175 H315 M300 175 V161 M495 175 H480 M495 175 V161"
            fill="none" stroke="#E8D5EF" stroke-width="1.5"/>

      <!-- Header -->
      <text x="311" y="82" fill="#E8D5EF"
            font-family="monospace" font-size="9"
            letter-spacing="1.1">EVENT NODE 07</text>
      <text x="484" y="82" fill="#BEAED5"
            font-family="monospace" font-size="8" text-anchor="end">●</text>

      <!-- Information -->
      <text x="312" y="105" fill="#BEAED5"
            font-family="monospace" font-size="8"
            letter-spacing="1">COORDINATES</text>
      <text x="312" y="125" fill="#E8D5EF"
            font-family="Arial, sans-serif" font-size="15"
            font-weight="500">38.42° N</text>
      <text x="312" y="144" fill="#E8D5EF"
            font-family="Arial, sans-serif" font-size="15"
            font-weight="500">27.14° E</text>
      <path d="M312 153 H483" stroke="#BEAED5" stroke-opacity=".45"/>
      <text x="312" y="166" fill="#BEAED5"
            font-family="monospace" font-size="8"
            letter-spacing=".7">SPATIAL DATA / DEMO</text>

      <!-- Digital interference slices -->
      <g opacity="0">
        <animate attributeName="opacity"
          values="0;0;1;0;1;0;0"
          keyTimes="0;.70;.72;.74;.76;.79;1"
          dur="6.8s" repeatCount="indefinite"/>
        <path d="M300 98 H366 L360 102 H300 Z"
              fill="#E8D5EF"/>
        <path d="M382 116 H495 V120 H390 Z"
              fill="#BEAED5"/>
        <path d="M300 143 H350 V146 H300 Z"
              fill="#E8D5EF"/>
        <path d="M423 154 H495 V158 H423 Z"
              fill="#BEAED5"/>
      </g>

      <!-- Ghosted signal offset -->
      <g fill="none" stroke="#E8D5EF" stroke-opacity=".8"
         opacity="0">
        <animate attributeName="opacity"
          values="0;0;1;0;1;0"
          keyTimes="0;.71;.73;.75;.77;1"
          dur="6.8s" repeatCount="indefinite"/>
        <path d="M304 92 H493 M307 135 H487"/>
      </g>
    </g>
  </g>

  <path d="M18 306 H502" stroke="#BEAED5" stroke-opacity=".4"/>
  <text x="18" y="320" fill="#BEAED5" font-family="monospace"
        font-size="8" letter-spacing="1">ACE / OBSERVE · CONNECT · EXPLORE</text>
  <text x="502" y="320" fill="#E8D5EF" font-family="monospace"
        font-size="8" text-anchor="end">EXPLORER v0.1</text>
</svg>
