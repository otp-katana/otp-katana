  <text x="35" y="30" class="muted">SYSTEM MODULE / 02</text>
  <text x="35" y="51" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">TECHNICAL ARSENAL</text>

  <g transform="translate(745 20)">
